<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خيارات سيستم 1</title>
<style>
  body{max-width:560px;margin:24px auto;padding:0 16px;font:15px system-ui,Segoe UI,Tahoma,sans-serif;color:#111}
  label{display:block;margin:12px 0 4px;font-weight:600}
  input,select{width:100%;box-sizing:border-box;padding:8px;font:inherit}
  button{cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:#4f46e5;color:#fff;font:inherit;margin:12px 6px 0 0}
  button.sec{background:#e5e7eb;color:#111}
  .muted{color:#6b7280;font-size:13px}
  #msg{margin-top:12px;font-weight:600}
</style>
</head>
<body>
  <h1>خيارات الإضافة</h1>
  <p class="muted">من النظام: شاشة الإضافة ← «جهاز جديد» ← انسخ التوكن والصقه هون. التوكن بينحفظ بهالمتصفح بس، والنظام بيحفظ بصمته.</p>
  <label for="url">رابط النظام</label>
  <input id="url" dir="ltr" placeholder="https://s1.zakiai.io">
  <label for="token">توكن الجهاز</label>
  <input id="token" dir="ltr" type="password" autocomplete="off" placeholder="الصق التوكن">
  <label for="market">السوق الافتراضي</label>
  <select id="market"><option value="SY">سوريا</option><option value="JO">الأردن</option></select>
  <div>
    <button id="connect">اتصل</button>
    <button id="refresh" class="sec">حدّث المحددات الآن</button>
  </div>
  <div id="msg" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
